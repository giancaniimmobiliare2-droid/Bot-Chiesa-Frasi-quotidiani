name: Bot Chiesa Automatico

on:
  schedule:
    # 1. MATTINA: Tutti i giorni alle 07:00 Italia (06:00 UTC)
    # Manda il versetto del giorno normale
    - cron: '0 6 * * *'

    # 2. POMERIGGIO WEEKEND: Sabato e Domenica alle 17:00 Italia (16:00 UTC)
    # Sabato: manda l'invito per domani
    # Domenica: manda il reminder per il culto delle 18:00
    - cron: '0 16 * * 6,0'

  # Permette di avviare il bot manualmente dal tasto "Run workflow" per i test
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Scarica il codice (Checkout)
        uses: actions/checkout@v3

      - name: 🐍 Installa Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📚 Installa le librerie necessarie
        run: |
          pip install requests pandas matplotlib pillow

      - name: 🚀 Avvia il Bot
        env:
          # Collega i "Secrets" di GitHub alle variabili del codice Python
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

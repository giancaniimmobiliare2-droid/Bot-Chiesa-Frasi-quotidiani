name: Bot Chiesa Semplice

on:
  schedule:
    # Si attiva tutti i giorni alle 08:00 Italiane (07:00 UTC)
    - cron: '0 7 * * *'

  # Lasciamo il pulsante manuale per fare i test se serve
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Scarica Codice
        uses: actions/checkout@v3

      - name: 🐍 Installa Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📚 Installa Librerie
        run: |
          pip install requests pandas matplotlib pillow

      - name: 🚀 Avvia il Bot
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
